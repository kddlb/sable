[workspace]
resolver = "3"
members = ["crates/sable-core", "crates/sable-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
realfft = "3.5"
hound = "3.5"
rand_chacha = "0.10"
rand_core = "0.10"
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
proptest = "1"

[profile.test]
opt-level = 2

[profile.release]
debug = 1
